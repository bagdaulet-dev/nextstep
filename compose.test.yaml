# Disposable test database; never use these public credentials for real records.
name: nextstep-tests
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: nextstep-tests-only
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: nextstep
    ports:
      - "127.0.0.1:3310:3306"
    tmpfs:
      - /var/lib/mysql:size=512m
    command:
      [
        "--character-set-server=utf8mb4",
        "--innodb-buffer-pool-size=128M",
        "--max-connections=50",
      ]
    mem_limit: 512m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -h 127.0.0.1 -u root -e "SELECT 1" >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
